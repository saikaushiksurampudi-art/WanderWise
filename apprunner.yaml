version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      # --include=dev is required: the build needs vite/esbuild, and App Runner
      # may set NODE_ENV=production, which would otherwise skip devDependencies.
      - npm ci --include=dev
      - npm run build
run:
  runtime-version: 22
  command: npm start
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: production
